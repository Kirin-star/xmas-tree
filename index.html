<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粒子圣诞树 · 晨蓝与紫罗兰</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font: 12.5px/1.6 ui-sans-serif, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .22em; color: #d9d2bd; opacity: .5;
    pointer-events: none; user-select: none; white-space: nowrap;
    text-shadow: 0 0 16px rgba(255, 226, 178, .45);
    transition: opacity 1s ease;
  }
  #hint.gone { opacity: 0; }
  /* 开场浮动字幕 */
  #title {
    position: fixed; left: 0; right: 0; top: 34%;
    text-align: center; pointer-events: none; user-select: none;
    opacity: 1;
  }
  #title .l1 {
    font-family: "Segoe Script", "Lucida Handwriting", "Brush Script MT",
                 "STKaiti", "KaiTi", "Kaiti SC", cursive;
    font-size: clamp(30px, 5.4vw, 68px);
    line-height: 1.1; color: #fff7e2;
    letter-spacing: .03em;
    text-shadow: 0 0 20px rgba(255, 236, 200, .62),
                 0 0 54px rgba(246, 208, 198, .34);
  }
  #title .l2 {
    margin-top: .5em;
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", "SimSun", serif;
    font-size: clamp(13px, 1.6vw, 21px);
    line-height: 1.8; color: rgba(240, 236, 222, .94);
    letter-spacing: .38em; text-indent: .38em;
    text-shadow: 0 0 14px rgba(255, 225, 180, .45);
  }
  #title span { display: inline-block; will-change: transform, opacity, filter; }
  /* 背景音乐按钮 */
  #mbtn {
    position: fixed; right: 16px; bottom: 16px; height: 40px; padding: 0 15px;
    display: none; align-items: center; justify-content: center; gap: 6px;
    border-radius: 20px;
    border: 1px solid rgba(255, 238, 215, .40);
    background: rgba(18, 17, 15, .60); color: #f3ecdf;
    font: 13px/1 ui-sans-serif, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .06em;
    cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 0 20px rgba(255, 210, 150, .28);
    transition: opacity .5s ease, transform .18s ease, border-color .2s ease;
  }
  #mbtn.ready { animation: mgLow 2.6s ease-in-out infinite; }
  @keyframes mgLow {
    0%, 100% { box-shadow: 0 0 16px rgba(255, 210, 150, .24); }
    50%      { box-shadow: 0 0 26px rgba(255, 232, 190, .58); }
  }
  #mbtn:hover { transform: scale(1.04); border-color: rgba(255, 240, 214, .78); }
  #mbtn.off { opacity: .55; }

  /* 许愿浮窗（胶囊） */
  #wish { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%);
          display: none; justify-content: center; z-index: 6; }
  #wish .wcard {
    min-width: 268px; max-width: 88vw; padding: 19px 26px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255, 238, 215, .38);
    background: rgba(20, 19, 17, .56);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 0 34px rgba(255, 224, 176, .16), inset 0 0 22px rgba(255, 240, 214, .06);
    text-align: center;
    opacity: 0; transform: scale(.88);
    transition: opacity .75s ease, transform .85s cubic-bezier(.2,.9,.25,1);
  }
  #wish.on .wcard { opacity: 1; transform: scale(1); }
  #wish .wt {
    font-family: "STKaiti", "KaiTi", "Kaiti SC", "Songti SC", serif;
    font-size: 21px; letter-spacing: .30em; text-indent: .30em;
    color: #fff3e0; text-shadow: 0 0 18px rgba(255, 214, 158, .55);
  }
  #wish .wrow { margin-top: 9px; display: flex; align-items: center; justify-content: center; gap: 9px; }
  #win {
    width: 170px; padding: 7px 3px 6px;
    border: none; border-bottom: 1px solid rgba(255, 238, 215, .34);
    background: transparent; outline: none;
    color: #fff6e8; font: 16px/1.4 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .06em; text-align: center;
  }
  #win::placeholder { color: rgba(255, 240, 220, .34); letter-spacing: .10em; }
  #wgo {
    padding: 7px 15px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255, 238, 215, .46);
    background: rgba(255, 238, 215, .10); color: #fff3e0;
    font: 13px/1 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    letter-spacing: .14em; text-indent: .14em;
    -webkit-tap-highlight-color: transparent;
    transition: background .2s ease;
  }
  #wgo:hover { background: rgba(255, 238, 215, .22); }
  #wish .wtn {
    margin-top: 8px; font: 10.5px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: rgba(255, 240, 222, .40); letter-spacing: .10em;
  }
  #wish.out .wcard { opacity: 0; transform: scale(.02);
    transition: opacity .5s ease, transform .62s cubic-bezier(.5,0,.75,0); }
  #wish.shake .wcard { animation: wshake .42s ease; }
  @keyframes wshake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><div class="l1"></div><div class="l2"></div></div>
<div id="hint">点击任意处 · 星屑迸散</div>
<div id="wish">
  <div class="wcard">
    <div class="wt">许个愿吧</div>
    <div class="wrow">
      <input id="win" maxlength="18" autocomplete="off" placeholder="写下你的愿望">
      <button id="wgo" type="button">确认</button>
    </div>
    <div class="wtn">确认后不可更改 · 只能许一次</div>
  </div>
</div>
<audio id="bgm" loop preload="auto" playsinline></audio>
<button id="mbtn" aria-label="背景音乐">♪ 音乐</button>
<script>
(function () {
  "use strict";

  var cvs = document.getElementById("c");
  var ctx = cvs.getContext("2d");
  var TAU = Math.PI * 2;
  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var clamp = function (v, a, b) { return v < a ? a : (v > b ? b : v); };
  var clamp01 = function (v) { return v < 0 ? 0 : (v > 1 ? 1 : v); };
  var smooth01 = function (v) { v = clamp01(v); return v * v * (3 - 2 * v); };

  /* ---------------- 开场时间线 ----------------
     0.0–1.1s  字幕逐字浮现并上下浮动
     1.1–3.1s  停留 2 秒
     3.1–4.15s 字粒四散消失
     4.05–6.6s 树体粒子从四面八方汇聚成型（雪花同时开始飘落）
     5.3–6.6s  法阵淡入，5.7–6.4s 星星亮起                        */
  var introT = 0;                 // 开场计时（秒）
  var convK = 0;                  // 汇聚进度 0→1
  var snowA = 0, starA = 0, cirA = 0, moteA = 0, flowA = 0;
  var hintShown = false, hintGone = false;
  var cyc = 0;      // 虚影缩放的中心（树腰高度）
  var INTRO_CONV0 = 4.05, INTRO_CONV_DUR = 3.80;

  // 每颗粒子的"从哪来"：从树尖的星星垂落，越靠上的枝条越先落位
  function scatterFor(th, r, h) {
    var ang = rnd(0, TAU), d = rnd(6, 46);
    return {
      kx: rnd(0.12, 0.55),          // 起始横向铺开：占最终半径的比例
      jx: Math.cos(ang) * d,
      jy: Math.sin(ang) * d * 0.8 + rnd(-0.10, 0.14) * treeH,
      dly: clamp01((h || 0) * 0.45 + rnd(0, 0.05))
    };
  }
  // 漩涡：偏移方向随"剩余距离"旋转，尘云像被吸进去一样打着旋收束
  var SWC = [], SWS = [];
  (function () {
    for (var i = 0; i <= 32; i++) {
      var a = (i / 32) * 0.90;
      SWC[i] = Math.cos(a); SWS[i] = Math.sin(a);
    }
  })();
  function swirlIdx(P) { var k = (P * 32) | 0; return k > 32 ? 32 : (k < 0 ? 0 : k); }

  // 单颗粒子的汇聚缓动（自带延迟）
  function convE(p) {
    if (convK >= 1) return 1;
    if (convK <= p.dly) return 0;
    var e = clamp01((convK - p.dly) / 0.55);
    return e * e * (3 - 2 * e);
  }

  /* ---------------- 调色：晨蓝 → 紫罗兰 ---------------- */
  var RAMP = [
    [0.00, [ 70, 130, 148]],   // 深青绿偏蓝
    [0.32, [100, 166, 188]],
    [0.58, [148, 196, 222]],   // 雾蓝过渡
    [0.80, [204, 166, 198]],   // 藕荷粉（粉里带蓝）
    [1.00, [224, 202, 196]]    // 冷奶油（偏灰蓝的白）
  ];
  function rampAt(h) {
    h = clamp(h, 0, 1);
    for (var i = 0; i < RAMP.length - 1; i++) {
      var a = RAMP[i], b = RAMP[i + 1];
      if (h >= a[0] && h <= b[0]) {
        var f = (h - a[0]) / (b[0] - a[0]);
        return [
          a[1][0] + (b[1][0] - a[1][0]) * f,
          a[1][1] + (b[1][1] - a[1][1]) * f,
          a[1][2] + (b[1][2] - a[1][2]) * f
        ];
      }
    }
    return RAMP[RAMP.length - 1][1].slice();
  }
  function whitened(c, f) {
    return [
      Math.round(c[0] + (255 - c[0]) * f),
      Math.round(c[1] + (255 - c[1]) * f),
      Math.round(c[2] + (255 - c[2]) * f)
    ];
  }
  function rgbStr(c) { return "rgb(" + c[0] + "," + c[1] + "," + c[2] + ")"; }

  // 调色板：每 2 个一组（同色系的饱和版 + 提亮版）
  var COLORS = [];
  for (var pi = 0; pi < 8; pi++) {
    var base = rampAt(pi / 7);
    COLORS.push(rgbStr(whitened(base, 0.02)));
    COLORS.push(rgbStr(whitened(base, 0.18)));
  }
  // 同冷色系的点缀色：冰蓝 / 薄荷 / 极光青
  var COOL_COLORS = ["#C3E3E0", "#CFE2E9", "#DAF1F1", "#A8D8C8", "#FBF2E2"];
  var IDX_COOL = COLORS.length;
  var COOL_N = COOL_COLORS.length;
  for (var co = 0; co < COOL_N; co++) COLORS.push(COOL_COLORS[co]);
  var IDX_TREE = COLORS.length;                       // 星与法阵的颜色起点
  var STAR_COLORS = ["#FFF6E2", "#FFE7BF", "#F7D2A8", "#FFFFFF"];
  for (var si = 0; si < STAR_COLORS.length; si++) COLORS.push(STAR_COLORS[si]);
  var CIRCLE_COLORS = ["#9EC2B2", "#D8E8DE", "#88B2A2"];
  for (var ci2 = 0; ci2 < CIRCLE_COLORS.length; ci2++) COLORS.push(CIRCLE_COLORS[ci2]);
  // 树上挂的彩球：暖金 / 蜜桃 / 淡紫 / 冰蓝 / 樱粉
  var BALL_COLORS = ["#FFF3E2", "#F6D0C6", "#CFE2E9", "#B7D8C8", "#EADFCB"];
  var IDX_BALL = COLORS.length;
  for (var ba2 = 0; ba2 < BALL_COLORS.length; ba2++) COLORS.push(BALL_COLORS[ba2]);
  // 环绕灯带：暖金为主 + 少量糖色点缀，避免和冷色树体混在一起
  var BAND_COLORS = [
    "#E9C29C", "#D9A87E", "#F2D6B8", "#FFEED6",   // 香槟金 / 蜜杏 / 浅杏 / 奶油
    "#DCCBB0", "#C9B394", "#F6D0C6", "#FFF6E4"    // 亚麻 / 燕麦 / 胭脂 / 象牙
  ];
  var IDX_BAND = COLORS.length;
  for (var bi = 0; bi < BAND_COLORS.length; bi++) COLORS.push(BAND_COLORS[bi]);

  // 法阵点缀色：灰蓝紫（六芒星 A）/ 灰青（六芒星 B）/ 暖灰金（符文）
  var DECO_COLORS = ["#E4A9BE", "#F2C6D6", "#CBB79A"];
  var IDX_DECO = COLORS.length;
  for (var dc = 0; dc < DECO_COLORS.length; dc++) COLORS.push(DECO_COLORS[dc]);

  // 每种颜色的光斑贴图
  var sprites = [];
  function makeSprite(rgb, core) {
    var size = 64, half = 32;
    var s = document.createElement("canvas");
    s.width = s.height = size;
    var g = s.getContext("2d");
    var grd = g.createRadialGradient(half, half, 0, half, half, half);
    grd.addColorStop(0.00, core || "rgba(255,255,255,1)");
    grd.addColorStop(0.18, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.92)");
    grd.addColorStop(0.45, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.28)");
    grd.addColorStop(0.75, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0.05)");
    grd.addColorStop(1.00, "rgba(" + rgb[0] + "," + rgb[1] + "," + rgb[2] + ",0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, size, size);
    return s;
  }
  function parseColor(str) {
    if (str.charAt(0) === "#") {
      var hx = str.slice(1);
      if (hx.length === 3) hx = hx[0] + hx[0] + hx[1] + hx[1] + hx[2] + hx[2];
      return [parseInt(hx.slice(0, 2), 16), parseInt(hx.slice(2, 4), 16), parseInt(hx.slice(4, 6), 16)];
    }
    var m = str.match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
    return [parseInt(m[1], 10), parseInt(m[2], 10), parseInt(m[3], 10)];
  }
  function buildSprites() {
    sprites = [];
    for (var i = 0; i < COLORS.length; i++) {
      sprites.push(makeSprite(parseColor(COLORS[i]),
        i >= IDX_DECO ? "rgba(255,248,238,0.94)"
        : (i >= IDX_BAND ? "rgba(255,240,214,1)"
        : (i >= IDX_TREE + 4 && i <= IDX_TREE + 6 ? "rgba(226,240,232,0.95)" : null))));
    }
  }

  /* ---------------- 画布 / 布局 ---------------- */
  var W = 0, H = 0, DPR = 1, cx = 0, groundY = 0, treeH = 0, R0 = 0, apexY = 0;
  var starY = 0, starR = 0;
  var mcx = 0, mcy = 0, mrx = 0, mry = 0;

  var bgC = null, pC = null, bC = null;
  var bgX = null, pX = null, bX = null;
  var BW = 0, BH = 0;
  var vignette = null;

  var rot = 0;            // 整体螺旋旋转角
  var cirRot = 0;         // 法阵结构旋转角（与树反向）
  var ringPh = [0, 0, 0]; // 法阵三环各自的转角
  var ringSp = [-0.070, -0.048, -0.030];  // 三环转速各不相同，且都与树体反向

  var cone = [], starP = [], cirP = [], motes = [], sparks = [];
  var balls = [], meteors = [], meteorT = 3.2, flows = [];
  var HELIX_TURNS = 5.4, HELIX_T0 = 0.02, HELIX_T1 = 0.665, conePhase = 0;
  var MOBILE = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || "") ||
               (typeof screen !== "undefined" && Math.min(screen.width || 999, screen.height || 999) < 540);
  var thinMode = false;   // 掉帧时自动抽稀体积雾 / 灯带

  function layout() {
    cx = W / 2;
    groundY = H * 0.885;
    treeH = Math.min(H * 0.695, W * 0.86);
    R0 = treeH * 0.335;
    apexY = groundY - treeH;
    starR = Math.max(11, treeH * 0.062);
    starY = apexY - treeH * 0.030 - starR * 0.55;

    mrx = Math.min(W * 0.415, R0 * 2.15);
    mry = mrx * 0.30;
    mcx = cx;
    mcy = groundY + treeH * 0.015;
  }
  /* ---------------- 七层树形：下 6 层圆台 + 顶层圆锥 ---------------- */
  // 自下而上的层高分界（0 = 地面，1 = 树尖）；层间落差越往上越小
  var TIER_H = [0, 0.185, 0.345, 0.492, 0.622, 0.738, 0.800, 1.0];
  var TIER_OVER = 1.45;     // 上一层底部相对下一层顶部的放大
  var TIER_FLARE = 0.34;    // 层底外翘的额外鼓出
  function envAt(h) { return R0 * Math.pow(1 - h, 0.94); }

  function tierOf(h) {
    var k = 0;
    while (k < TIER_H.length - 2 && h > TIER_H[k + 1]) k++;
    return k;
  }
  // 某高度处的树体半径：层内从"外翘的底缘"收到"层顶"，层与层之间有台阶
  function radiusAt(h) {
    h = clamp(h, 0, 1);
    var k = tierOf(h);
    var h0 = TIER_H[k], h1 = TIER_H[k + 1];
    var u = (h - h0) / (h1 - h0);
    var B = envAt(h0) * (k === 0 ? 1 : TIER_OVER);
    var T = envAt(h1);
    var pw = (k === 6 ? 1.18 : 1.35);          // 顶层近乎直锥，收到树尖
    var r = B + (T - B) * Math.pow(u, pw);     // 下宽上窄，收得靠上
    r *= 1 + TIER_FLARE * Math.exp(-u * 5.5);  // 底缘像松枝一样往外翘
    return r;
  }
  // 层间暗缝：紧贴层顶之上压暗，制造层与层之间的阴影带（只作用于体雾/壳/核）
  function seamShade(h) {
    var m = 1;
    for (var k = 1; k < TIER_H.length - 1; k++) {
      var d = h - TIER_H[k];
      if (d >= 0 && d < 0.015) {
        var f = 1 - d / 0.015;
        m = Math.min(m, 1 - 0.48 * f * f);
      }
    }
    return m;
  }

  /* ---------------- 粒子生成 ---------------- */
  function paletteIndex(h, white) {
    var k = clamp(Math.round(h * 7), 0, 7);
    return k * 2 + (white ? 1 : 0);
  }

  function treeColor(h, coolChance) {
    if (Math.random() < coolChance) return IDX_COOL + ((Math.random() * COOL_N) | 0);
    return paletteIndex(h, Math.random() < 0.26);
  }

  function addCone(h, th, rMul, size, a, ci, glow) {
    var sc = scatterFor(th, radiusAt(h) * rMul, h);
    cone.push({
      s0: Math.sin(th), c0: Math.cos(th),
      r: radiusAt(h) * rMul,
      yc: groundY - treeH * h,
      s: size, a: a * seamShade(h), g: glow,
      tw: rnd(0.5, 2.4), ph: rnd(0, TAU),
      ci: ci, kx: sc.kx, jx: sc.jx, jy: sc.jy, dly: sc.dly
    });
  }
  // 直接给定半径（层间枝轮用）
  function addRaw(h, th, r, size, a, ci, glow) {
    var sc = scatterFor(th, r, h);
    cone.push({
      s0: Math.sin(th), c0: Math.cos(th),
      r: r, yc: groundY - treeH * h,
      s: size, a: a, g: glow,
      tw: rnd(0.5, 2.4), ph: rnd(0, TAU),
      ci: ci, kx: sc.kx, jx: sc.jx, jy: sc.jy, dly: sc.dly
    });
  }

  var ribSegs = [];
  function buildRibbonSegs() {
    ribSegs = [];
    var ph = conePhase;
    for (var k = 0; k < TIER_H.length - 1; k++) {
      var turns = k === TIER_H.length - 2 ? 1.05 : 0.84;
      ribSegs.push({ h0: TIER_H[k] + 0.008, h1: TIER_H[k + 1] - 0.010, ph: ph, turns: turns });
      ph += TAU * turns * 0.55 + 1.7;
    }
  }

  function buildCone(q) {
    cone = [];
    var PHASE = rnd(0, TAU);
    conePhase = PHASE;
    var i, k, t, h, th, seg, hp, tt;

    // 1) 体积雾：填满七层，底部更密
    var mistN = Math.round(4200 * q);
    for (i = 0; i < mistN; i++) {
      h = 1 - Math.sqrt(1 - Math.random());
      addCone(h, rnd(0, TAU), 0.84 + 0.20 * Math.random(),
        rnd(2.0, 4.4), rnd(0.13, 0.34) * (1 - 0.26 * h),
        treeColor(h, 0.24), false);
      if (i % 2 === 0) cone[cone.length - 1].thin = true;   // 低配时可抽稀
    }

    // 2) 壳层：贴着每层的锥面走，让层与层的台阶清楚可读
    var shellN = Math.round(9800 * q);
    for (i = 0; i < shellN; i++) {
      h = Math.pow(Math.random(), 0.82) * 0.945;
      addCone(h, rnd(0, TAU), 0.88 + Math.random() * 0.13,
        rnd(2.2, 4.6), rnd(0.16, 0.38) * (1 - 0.20 * h),
        treeColor(h, 0.30), Math.random() < 0.10);
      if (i % 3 === 0) cone[cone.length - 1].thin = true;
    }

    // 3) 中轴核心：下半段更实
    var coreN = Math.round(2000 * q);
    for (i = 0; i < coreN; i++) {
      h = Math.pow(Math.random(), 1.5) * 0.80;
      addCone(h, rnd(0, TAU), Math.pow(Math.random(), 0.65) * 0.42,
        rnd(1.8, 3.8), rnd(0.14, 0.34) * (1 - 0.32 * h),
        treeColor(h, 0.26), false);
    }

    // 4) 层间外翘的枝轮：每层底缘一圈明显外凸的亮粒，外加下垂枝梢
    for (k = 1; k < TIER_H.length - 1; k++) {
      var hk = TIER_H[k];
      var E = envAt(hk);
      var n = Math.round((320 + 120 * (7 - k)) * q);
      for (i = 0; i < n; i++) {
        var ang = rnd(0, TAU);
        var rr = E * rnd(1.04, 1.42) * (1 + 0.09 * Math.sin(ang * 3 + k * 1.7) + 0.06 * Math.sin(ang * 7 - k * 2.3));
        addRaw(hk + rnd(-0.010, 0.012), ang, rr,
          rnd(2.2, 4.0), rnd(0.19, 0.46) * (1 - 0.28 * hk),
          treeColor(hk, 0.40), Math.random() < 0.12);
        // 下垂枝梢：从层底往外下方垂一小段，形成裙摆的锯齿边
        if (Math.random() < 0.62) {
          addRaw(hk - rnd(0.006, 0.034), ang + rnd(-0.06, 0.06), rr * rnd(0.90, 1.08),
            rnd(1.4, 2.8), rnd(0.16, 0.42), treeColor(hk, 0.45), false);
        }
      }
    }

    // 4b) 枝肋：每层 18 条从层顶向下外展的枝脊，让旋转时能看出放射状枝叶纹理
    for (k = 0; k < TIER_H.length - 1; k++) {
      var h0k = TIER_H[k], h1k = TIER_H[k + 1];
      var ribs = 24, roff = k * 0.19;
      var nPer = Math.round(22 * q);
      for (var rj = 0; rj < ribs; rj++) {
        var ra0 = (rj / ribs) * TAU + roff;
        for (var sq = 0; sq < nPer; sq++) {
          var ss = sq / (nPer - 1);                 // 0 = 层顶枝根，1 = 层底枝梢
          var uu = 1 - ss * 0.98;
          var hh = h0k + uu * (h1k - h0k);
          var ra = ra0 + 0.035 * Math.sin(ss * Math.PI) + rnd(-0.012, 0.012);
          var rr2 = radiusAt(hh) * rnd(1.00, 1.045) * (1 + 0.07 * ss * ss);
          addRaw(hh - 0.010 * ss * ss, ra, rr2,
            rnd(2.0, 3.8),
            rnd(0.30, 0.62) * (1 - 0.22 * hh) * (0.92 + 0.35 * ss),
            treeColor(hh, 0.30), Math.random() < (0.03 + 0.09 * ss * ss));
        }
      }
    }

    // 5) 主螺旋灯带：单独一套会流动的粒子，见 buildBand()

    // 6) 顶部光柱：从最上层的底缘接到星星
    var plumeN = Math.round(680 * q);
    for (i = 0; i < plumeN; i++) {
      hp = rnd(TIER_H[6] - 0.012, 0.978);
      tt = clamp((hp - TIER_H[6]) / (1 - TIER_H[6]), 0, 1);
      addCone(hp, rnd(0, TAU), rnd(0.10, 0.80) * (1 - 0.55 * tt),
        rnd(1.5, 3.0), rnd(0.20, 0.52) * (1 - 0.28 * tt),
        treeColor(hp, 0.42), false);
    }

    // 7) 底部裙边：最下层外沿更亮的一圈
    var hemN = Math.round(520 * q);
    for (i = 0; i < hemN; i++) {
      addCone(rnd(-0.012, 0.05), rnd(0, TAU), rnd(0.90, 1.06),
        rnd(2.0, 3.8), rnd(0.16, 0.38),
        treeColor(rnd(0, 0.10), 0.30), false);
    }

    cone.sort(function (a, b) { return a.ci - b.ci; });
    buildRibbonSegs();
  }

  /* 灯带：沿每层螺旋上升的流动光带（比树体更密、更亮、多色） */
  var bandLUT = [], bandPts = [], bandW = 5;
  function buildBandLUT() {
    bandLUT = [];
    bandW = Math.max(7.4, treeH * 0.0210);   // 光带宽度随树体缩放
    var N = 128;
    for (var k = 0; k < ribSegs.length; k++) {
      var seg = ribSegs[k], arr = [];
      for (var i = 0; i < N; i++) {
        var tt = i / N;
        var hh = seg.h0 + (seg.h1 - seg.h0) * tt;
        var thh = seg.ph + tt * TAU * seg.turns;
        arr.push({
          r: radiusAt(hh) * 1.008,
          yc: groundY - treeH * hh,
          s0: Math.sin(thh), c0: Math.cos(thh)
        });
      }
      bandLUT.push(arr);
    }
  }
  function buildBand(q) {
    bandPts = [];
    var NB = BAND_COLORS.length;
    for (var k = 0; k < bandLUT.length; k++) {
      var n = Math.round((1400 + 230 * (7 - k)) * q);
      for (var i = 0; i < n; i++) {
        var warm = Math.random() < 0.62;
        var sc1 = scatterFor(Math.atan2(bandLUT[k][0].s0, bandLUT[k][0].c0) + rnd(0, TAU), bandLUT[k][0].r, 0.55);
        bandPts.push({
          k: k,
          p: Math.random(),
          sp: rnd(0.13, 0.20),
          rm: rnd(0.985, 1.035),
          w: rnd(-1, 1),
          dy: rnd(-1.6, 1.6),
          s: rnd(1.8, 3.2),
          a: rnd(0.10, 0.24) * (1 - 0.18 * (k / 6)),
          ci: warm ? (IDX_BAND + ((Math.random() * 4) | 0))
                   : (IDX_BAND + 4 + ((Math.random() * (NB - 4)) | 0)),
          g: Math.random() < 0.10,
          tw: rnd(0.7, 2.6), ph: rnd(0, TAU), thin: (i % 2 === 0),
          kx: sc1.kx, jx: sc1.jx, jy: sc1.jy, dly: sc1.dly
        });
      }
      var nb = Math.round((34 + 8 * (7 - k)) * q);
      for (var j = 0; j < nb; j++) {
        var sc2 = scatterFor(Math.atan2(bandLUT[k][0].s0, bandLUT[k][0].c0) + rnd(0, TAU), bandLUT[k][0].r, 0.55);
        bandPts.push({
          k: k, p: Math.random(), sp: rnd(0.13, 0.20),
          rm: rnd(0.99, 1.02), w: rnd(-0.55, 0.55), dy: 0,
          s: rnd(3.2, 5.4), a: rnd(0.12, 0.26),
          ci: IDX_BAND + ((Math.random() * 3) | 0),
          g: true, tw: rnd(0.6, 2.0), ph: rnd(0, TAU),
          kx: sc2.kx, jx: sc2.jx, jy: sc2.jy, dly: sc2.dly
        });
      }
    }
  }
  function updateBand(dt) {
    for (var i = 0; i < bandPts.length; i++) {
      var b = bandPts[i];
      b.p += b.sp * dt;
      if (b.p >= 1) b.p -= 1;
    }
  }
  function drawBand(cosR, sinR, t) {
    if (convK < 0.02) return;
    var lastCi = -1;
    for (var i = 0; i < bandPts.length; i++) {
      var b = bandPts[i];
      var lut = bandLUT[b.k];
      if (!lut) continue;
      var e = lut[(b.p * 128) | 0];
      if (!e) continue;
      var edge = Math.min(1, Math.min(b.p, 1 - b.p) * 16);   // 段首段尾淡入淡出，藏住循环跳变
      if (edge <= 0.02) continue;
      var sy = e.s0 * cosR + e.c0 * sinR;
      var sx = e.c0 * cosR - e.s0 * sinR;
      var bw = b.w * bandW;                       // 沿法向铺开，做出光带的宽度
      var r = e.r * b.rm + bw;
      var depth = (sy + 1) * 0.5;
      var x = cx + sx * r;
      var y = e.yc + b.dy + bw * 0.38 + sy * r * 0.16;
      var csb = 1;
      if (convK < 1) {
        csb = convE(b);
        if (csb < 0.02) continue;
        var bx0 = cx + (x - cx) * b.kx + b.jx, by0 = starY + b.jy;
        x = bx0 + (x - bx0) * Math.pow(csb, 1.25);
        y = by0 + (y - by0) * Math.pow(csb, 0.78);
      }
      var tw = 0.66 + 0.34 * Math.sin(t * b.tw + b.ph);
      var a = b.a * tw * (0.45 + 0.55 * depth) * edge * (0.18 + 0.82 * csb);
      if (a <= 0.012) continue;
      var s = b.s * (0.74 + 0.44 * depth);
      if (b.g) {
        pX.globalAlpha = Math.min(1, a * 1.15);
        pX.drawImage(sprites[b.ci], x - s * 2.4, y - s * 2.4, s * 4.8, s * 4.8);
      }
      if (thinMode && b.thin) continue;
      if (b.ci !== lastCi) { pX.fillStyle = COLORS[b.ci]; lastCi = b.ci; }
      pX.globalAlpha = Math.min(1, a);
      pX.fillRect(x - s * 0.5, y - s * 0.5, s, s);
    }
  }
  /* 树上挂的彩球：球体 + 挂线 + 轻微摆动 */
  function buildBalls(q) {
    balls = [];
    var n = Math.round(78 * q);
    for (var i = 0; i < n; i++) {
      var h = rnd(0.04, 0.87);
      var th = rnd(0, TAU);
      var rad = Math.max(2.6, treeH * rnd(0.0105, 0.0175));
      var scb = scatterFor(th, radiusAt(h), h);
      balls.push({
        s0: Math.sin(th), c0: Math.cos(th),
        r: radiusAt(h) * rnd(0.84, 1.0),
        yc: groundY - treeH * h,
        rad: rad,
        ci: IDX_BALL + ((Math.random() * BALL_COLORS.length) | 0),
        tw: rnd(0.6, 1.7), ph: rnd(0, TAU), a: rnd(0.55, 0.95),
        kx: scb.kx, jx: scb.jx, jy: scb.jy, dly: scb.dly
      });
    }
  }

  /* 五角星粒子 */
  function buildStar(q) {
    starP = [];
    var pts = [];
    for (var i = 0; i < 10; i++) {
      var rr = (i % 2 === 0) ? starR : starR * 0.44;
      var a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    function inStar(x, y) {
      var inside = false;
      for (var i2 = 0, j2 = pts.length - 1; i2 < pts.length; j2 = i2++) {
        var xi = pts[i2][0], yi = pts[i2][1];
        var xj = pts[j2][0], yj = pts[j2][1];
        if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
      }
      return inside;
    }
    function polar(x, y) { return { rad: Math.sqrt(x * x + y * y), ang: Math.atan2(y, x) }; }

    // 星体填充
    var fillN = Math.round(340 * q);
    var guard = 0;
    while (starP.length < fillN && guard++ < fillN * 40) {
      var x = rnd(-starR, starR), y = rnd(-starR, starR);
      if (!inStar(x, y)) continue;
      var d = Math.sqrt(x * x + y * y) / starR;
      if (Math.random() > 1 - 0.62 * d) continue;
      var pol = polar(x, y);
      starP.push({
        rad: pol.rad, ang: pol.ang, s: rnd(0.9, 2.1),
        a: rnd(0.26, 0.62) * (1 - 0.35 * d),
        ci: IDX_TREE + (Math.random() < 0.55 ? 0 : 1), g: false,
        tw: rnd(0.8, 3), ph: rnd(0, TAU)
      });
    }
    // 星轮廓：更亮
    var edges = Math.round(150 * q);
    for (var e = 0; e < 10; e++) {
      var p1 = pts[e], p2 = pts[(e + 1) % 10];
      var cnt = Math.max(4, Math.round(edges / 10));
      for (var c2 = 0; c2 < cnt; c2++) {
        var f = c2 / cnt + rnd(-0.012, 0.012);
        var ex = p1[0] + (p2[0] - p1[0]) * f + rnd(-0.6, 0.6);
        var ey = p1[1] + (p2[1] - p1[1]) * f + rnd(-0.6, 0.6);
        var pol2 = polar(ex, ey);
        starP.push({
          rad: pol2.rad, ang: pol2.ang, s: rnd(1.2, 2.5),
          a: rnd(0.52, 0.82), ci: IDX_TREE + 3, g: false,
          tw: rnd(0.8, 3), ph: rnd(0, TAU)
        });
      }
    }
    // 星芯 + 环绕光点
    for (var g2 = 0; g2 < Math.round(16 * q) + 6; g2++) {
      var gr = rnd(0, starR * 0.55), ga = rnd(0, TAU);
      starP.push({
        rad: gr, ang: ga, s: rnd(6, 14), a: rnd(0.25, 0.55),
        ci: IDX_TREE + (Math.random() < 0.5 ? 1 : 2), g: true,
        tw: rnd(0.8, 2.2), ph: rnd(0, TAU)
      });
    }
    starP.sort(function (a, b) { return a.ci - b.ci; });
  }

  /* 地面法阵粒子（浅灰蓝 + 灰紫/灰青/暖灰金点缀） */
  function buildCircle(q) {
    cirP = [];
    function add(rad, ang, size, a, ci, glow, rg, ex) {
      var o = {
        rad: rad, ang: ang, s: size, a: a, ci: ci, g: glow,
        rg: rg === undefined ? -1 : rg,
        tw: rnd(0.4, 1.7), ph: rnd(0, TAU)
      };
      if (ex) for (var kk in ex) o[kk] = ex[kk];
      cirP.push(o);
    }
    // 三道主环：每环各转各的（转速不同），环带径向宽度加宽到三倍
    var rings = [[1.0, 2000], [0.83, 1450], [0.60, 1150]];
    for (var r = 0; r < rings.length; r++) {
      var rr = rings[r][0];
      var n = Math.round(rings[r][1] * q);
      for (var i = 0; i < n; i++) {
        add(rr + rnd(-0.019, 0.019), rnd(0, TAU), rnd(1.8, 3.4),
          rnd(0.50, 0.92), IDX_TREE + 4 + ((Math.random() * 3) | 0), Math.random() < 0.12, r);
      }
    }
    // 24 根刻度辐条：雷达扫描式点亮（sw 标记）
    for (var s = 0; s < 24; s++) {
      var a0 = (s / 24) * TAU;
      for (var d2 = 0; d2 < 12; d2++) {
        var t2 = d2 / 11;
        add(0.620 + 0.380 * t2, a0 + rnd(-0.004, 0.004),
          rnd(1.9, 3.5), rnd(0.40, 0.78) * (1 - 0.25 * t2),
          IDX_TREE + 5, Math.random() < 0.55, -1, { sw: 1 });
      }
    }
    // 六芒星：两个三角形各自反向慢转，六个角依次迸亮
    var hexPts = [];
    for (var hx = 0; hx < 6; hx++) {
      var ha = -Math.PI / 2 + hx * TAU / 6;
      hexPts.push([Math.cos(ha) * 0.560, Math.sin(ha) * 0.560]);
    }
    for (var tri = 0; tri < 2; tri++) {
      for (var e2 = 0; e2 < 3; e2++) {
        var i1 = (e2 * 2 + tri) % 6, i2 = ((e2 * 2 + 2 + tri) % 6);
        var pa = hexPts[i1], pb = hexPts[i2];
        for (var c3 = 0; c3 < 48; c3++) {
          var f2 = c3 / 48 + rnd(-0.005, 0.005);
          var px2 = pa[0] + (pb[0] - pa[0]) * f2;
          var py2 = pa[1] + (pb[1] - pa[1]) * f2;
          add(Math.sqrt(px2 * px2 + py2 * py2), Math.atan2(py2, px2),
            rnd(2.2, 4.2), rnd(0.55, 0.90),
            IDX_DECO + tri, Math.random() < 0.32, -1,
            { hx: 1, tri: tri, v0: i1, v1: i2, e: f2 });
        }
      }
    }
    // 外圈符文：12 组，按顺序轮流点亮
    for (var rn = 0; rn < 12; rn++) {
      var ra = (rn / 12) * TAU + 0.13;
      for (var d3 = 0; d3 < 9; d3++) {
        var off = d3 / 8 - 0.5;
        add(0.735 + off * 0.16, ra + off * 0.055,
          rnd(1.6, 3.0), rnd(0.48, 0.90), IDX_DECO + 2, false, -1, { rn: rn });
      }
    }
    // 地面弥散光尘
    var poolN = Math.round(400 * q);
    for (var pn = 0; pn < poolN; pn++) {
      add(Math.pow(Math.random(), 0.6) * 1.25, rnd(0, TAU),
        rnd(1.0, 2.2), rnd(0.05, 0.22), IDX_TREE + 4 + ((Math.random() * 3) | 0), false);
    }
    cirP.sort(function (a, b) { return a.ci - b.ci; });
  }

  /* ---------------- 背景（预渲染） ---------------- */
  function buildBackground() {
    bgC.width = Math.max(1, Math.round(W * DPR));
    bgC.height = Math.max(1, Math.round(H * DPR));
    bgX.setTransform(DPR, 0, 0, DPR, 0, 0);

    var g = bgX.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#05070a");
    g.addColorStop(0.45, "#080a0c");
    g.addColorStop(0.78, "#0a0a08");
    g.addColorStop(1, "#050505");
    bgX.fillStyle = g;
    bgX.fillRect(0, 0, W, H);

    // 星云
    var neb = [
      [cx - W * 0.20, H * 0.26, W * 0.44, "rgba(136,178,162,0.055)"],
      [cx + W * 0.20, H * 0.44, W * 0.38, "rgba(246,208,198,0.048)"],
      [cx, groundY, W * 0.48, "rgba(206,226,233,0.045)"]
    ];
    bgX.globalCompositeOperation = "lighter";
    for (var i = 0; i < neb.length; i++) {
      var nb = neb[i];
      var rg = bgX.createRadialGradient(nb[0], nb[1], 0, nb[0], nb[1], nb[2]);
      rg.addColorStop(0, nb[3]);
      rg.addColorStop(1, "rgba(0,0,0,0)");
      bgX.fillStyle = rg;
      bgX.fillRect(0, 0, W, H);
    }

    // 树体背光：底部晨蓝、顶部紫罗兰
    var tint = [
      [cx, groundY - treeH * 0.10, R0 * 1.65, "rgba(136,178,162,0.15)"],
      [cx, apexY + treeH * 0.26, R0 * 1.25, "rgba(255,239,215,0.13)"],
      [cx, groundY - treeH * 0.45, R0 * 0.95, "rgba(255,255,255,0.05)"]
    ];
    for (var ti = 0; ti < tint.length; ti++) {
      var tt2 = tint[ti];
      var rg2 = bgX.createRadialGradient(tt2[0], tt2[1], 0, tt2[0], tt2[1], tt2[2]);
      rg2.addColorStop(0, tt2[3]);
      rg2.addColorStop(1, "rgba(0,0,0,0)");
      bgX.fillStyle = rg2;
      bgX.fillRect(0, 0, W, H);
    }

    // 静态星点
    var starN = Math.round(Math.min(320, W * H / 5200));
    for (var s = 0; s < starN; s++) {
      var sx = rnd(0, W), sy = rnd(0, groundY * 0.95);
      var r = Math.pow(Math.random(), 2.2) * 1.5 + 0.25;
      var a = rnd(0.10, 0.55);
      bgX.fillStyle = "rgba(" + (200 + ((Math.random() * 55) | 0)) + ",225,255," + a + ")";
      bgX.beginPath();
      bgX.arc(sx, sy, r, 0, TAU);
      bgX.fill();
    }
    bgX.globalCompositeOperation = "source-over";

    vignette = ctx.createRadialGradient(cx, H * 0.42, Math.min(W, H) * 0.28, cx, H * 0.42, Math.max(W, H) * 0.78);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,0.72)");
  }

  /* ---------------- 微尘 / 迸散 ---------------- */
  function buildMotes(q) {
    motes = [];
    var n = Math.round(70 * q);
    for (var i = 0; i < n; i++) {
      motes.push({
        x: rnd(cx - R0 * 1.5, cx + R0 * 1.5),
        y: rnd(apexY, groundY),
        vy: rnd(-16, -42), vx: rnd(-8, 8),
        s: rnd(0.7, 2.0), a: rnd(0.12, 0.5),
        ph: rnd(0, TAU), tw: rnd(0.5, 1.8),
        ci: paletteIndex(rnd(0, 1), Math.random() < 0.5)
      });
    }
  }
  function burst(x, y) {
    var n = 60;
    for (var i = 0; i < n; i++) {
      var a = rnd(0, TAU), sp = rnd(40, 330);
      sparks.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
        life: rnd(0.8, 1.9), s: rnd(5, 16),
        ci: (Math.random() < 0.35) ? IDX_TREE + ((Math.random() * 4) | 0) : ((Math.random() * 16) | 0)
      });
    }
  }

  /* ---------------- 雪花 ---------------- */
  var snow = [], snowSprite = null;
  function buildSnowSprite() {
    var S = 64, c = S / 2;
    var cv = document.createElement("canvas");
    cv.width = cv.height = S;
    var g = cv.getContext("2d");
    g.translate(c, c);
    g.strokeStyle = "rgba(234,247,255,0.95)";
    g.lineWidth = 2.0;
    g.lineCap = "round";
    for (var k = 0; k < 6; k++) {
      g.save();
      g.rotate(k * Math.PI / 3);
      g.beginPath();
      g.moveTo(0, 0); g.lineTo(0, -c + 4);
      g.moveTo(0, -c * 0.72); g.lineTo(-c * 0.26, -c * 0.92);
      g.moveTo(0, -c * 0.72); g.lineTo(c * 0.26, -c * 0.92);
      g.moveTo(0, -c * 0.42); g.lineTo(-c * 0.18, -c * 0.56);
      g.moveTo(0, -c * 0.42); g.lineTo(c * 0.18, -c * 0.56);
      g.stroke();
      g.restore();
    }
    var grd = g.createRadialGradient(0, 0, 0, 0, 0, c * 0.30);
    grd.addColorStop(0, "rgba(255,255,255,0.85)");
    grd.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.beginPath();
    g.arc(0, 0, c * 0.30, 0, TAU);
    g.fill();
    snowSprite = cv;
  }
  function buildSnow(q) {
    snow = [];
    var n = Math.round(225 * Math.max(0.7, Math.min(1.35, q)));
    for (var i = 0; i < n; i++) {
      var near = Math.random() < 0.46;
      snow.push({
        x: rnd(-20, W + 20), y: rnd(-H, H),
        s: near ? rnd(6.0, 11.5) : rnd(2.4, 5.0),
        vy: near ? rnd(30, 66) : rnd(12, 28),
        sw: rnd(6, 28), sp: rnd(0.25, 0.9), ph: rnd(0, TAU),
        rot: rnd(0, TAU), vr: rnd(-0.8, 0.8),
        a: near ? rnd(0.50, 0.90) : rnd(0.22, 0.50),
        tw: rnd(0.6, 2.0), front: near || Math.random() < 0.30
      });
    }
  }
  function drawSnow(t, dt, front) {
    if (!snowSprite) return;
    for (var i = 0; i < snow.length; i++) {
      var f = snow[i];
      if (f.front !== front) continue;
      f.y += f.vy * dt;
      f.rot += f.vr * dt;
      if (f.y > H + 24) { f.y = -24; f.x = rnd(-20, W + 20); }
      var x = f.x + Math.sin(t * f.sp + f.ph) * f.sw;
      var a = f.a * (0.72 + 0.28 * Math.sin(t * f.tw + f.ph)) * snowA;
      pX.save();
      pX.translate(x, f.y);
      pX.rotate(f.rot);
      pX.globalAlpha = a;
      pX.drawImage(snowSprite, -f.s * 0.5, -f.s * 0.5, f.s, f.s);
      pX.restore();
    }
  }

  /* ---------------- 绘制 ---------------- */
  /* 螺旋光带的连续底纹：每层各画一段，把散落的粒子串成一根光绳 */
  function drawRibbon(cosR, sinR) {
    if (!ribSegs.length) return;
    if (convK < 0.45) return;
    var ribA = (convK - 0.45) / 0.55;
    var M = 26;
    pX.lineCap = "round";
    pX.strokeStyle = COLORS[IDX_BAND + 1];
    for (var s = 0; s < ribSegs.length; s++) {
      var seg = ribSegs[s];
      var px = 0, py = 0;
      for (var i = 0; i <= M; i++) {
        var tt = i / M;
        var hh = seg.h0 + (seg.h1 - seg.h0) * tt;
        var thh = seg.ph + tt * TAU * seg.turns;
        var s0 = Math.sin(thh), c0 = Math.cos(thh);
        var rr = radiusAt(hh) * 1.005;
        var sy = s0 * cosR + c0 * sinR;
        var sx = c0 * cosR - s0 * sinR;
        var x = cx + sx * rr;
        var y = groundY - treeH * hh + sy * rr * 0.16;
        var dep = (sy + 1) * 0.5;
        if (i > 0) {
          pX.globalAlpha = (0.010 + 0.030 * dep) * ribA;
          pX.lineWidth = 1.0 + 1.2 * dep;
          pX.beginPath();
          pX.moveTo(px, py);
          pX.lineTo(x, y);
          pX.stroke();
        }
        px = x; py = y;
      }
    }
    pX.globalAlpha = 1;
  }
  function drawCone(cosR, sinR, t) {
    drawRibbon(cosR, sinR);
    var lastCi = -1;
    for (var i = 0; i < cone.length; i++) {
      var p = cone[i];
      if (thinMode && p.thin) continue;
      var sy = p.s0 * cosR + p.c0 * sinR;     // 近远判断
      var sx = p.c0 * cosR - p.s0 * sinR;
      var depth = (sy + 1) * 0.5;
      var x = cx + sx * p.r;
      var y = p.yc + sy * p.r * 0.16;
      var cs = 1, sx0 = 0, sy0 = 0;
      if (convK < 1) {
        cs = convE(p);
        if (cs < 0.02) continue;
        sx0 = cx + (x - cx) * p.kx + p.jx;
        sy0 = starY + p.jy;
        var eY = Math.pow(cs, 0.72), eX = Math.pow(cs, 1.65);
        x = sx0 + (x - sx0) * eX;
        y = sy0 + (y - sy0) * eY;
      }
      var tw = 0.62 + 0.38 * Math.sin(t * p.tw + p.ph);
      var a = p.a * tw * (0.45 + 0.55 * depth) * (0.18 + 0.82 * cs);
      if (a <= 0.012) continue;
      var s = p.s * (0.70 + 0.50 * depth);
      if (convK < 1 && cs < 0.985 && (i % 3 === 0)) {
        var ta = a * 0.42;
        if (ta > 0.02) {
          pX.globalAlpha = Math.min(1, ta);
          pX.fillRect(x + (sx0 - x) * 0.24 - s * 0.35, y + (sy0 - y) * 0.24 - s * 0.35, s * 0.7, s * 0.7);
        }
      }
      if (p.g) {
        pX.globalAlpha = Math.min(1, a * 1.4);
        pX.drawImage(sprites[p.ci], x - s * 2.6, y - s * 2.6, s * 5.2, s * 5.2);
      } else {
        if (p.ci !== lastCi) { pX.fillStyle = COLORS[p.ci]; lastCi = p.ci; }
        pX.globalAlpha = Math.min(1, a);
        pX.fillRect(x - s * 0.5, y - s * 0.5, s, s);
      }
    }
  }

  function drawBalls(cosR, sinR, t) {
    if (convK < 0.02) return;
    for (var i = 0; i < balls.length; i++) {
      var b = balls[i];
      var sy = b.s0 * cosR + b.c0 * sinR;
      var sx = b.c0 * cosR - b.s0 * sinR;
      var depth = (sy + 1) * 0.5;
      if (depth < 0.16) continue;          // 背面的球基本不画，免得"透视穿帮"
      var sway = Math.sin(t * 0.8 + b.ph) * b.rad * 0.24;
      var x = cx + sx * b.r + sway;
      var y = b.yc + sy * b.r * 0.16;
      var csd = 1;
      if (convK < 1) {
        csd = convE(b);
        if (csd < 0.04) continue;
        var bdx = cx + (x - cx) * b.kx + b.jx, bdy = starY + b.jy;
        x = bdx + (x - bdx) * Math.pow(csd, 1.25);
        y = bdy + (y - bdy) * Math.pow(csd, 0.78);
      }
      var r = b.rad * (0.80 + 0.32 * depth);
      var tw = 0.72 + 0.28 * Math.sin(t * b.tw + b.ph);
      var a = b.a * tw * (0.30 + 0.70 * depth) * (0.18 + 0.82 * csd);

      // 挂线
      pX.fillStyle = COLORS[b.ci];
      pX.globalAlpha = a * 0.30;
      for (var h1 = 1; h1 <= 3; h1++) {
        pX.fillRect(x - 0.7, y - r - h1 * r * 0.42, 1.4, 1.4);
      }
      // 外光晕 + 球芯
      pX.globalAlpha = a * 0.26;
      pX.drawImage(sprites[b.ci], x - r * 3.0, y - r * 3.0, r * 6.0, r * 6.0);
      pX.globalAlpha = a * 0.42;
      pX.drawImage(sprites[b.ci], x - r * 1.4, y - r * 1.4, r * 2.8, r * 2.8);
      // 球体轮廓点
      pX.fillStyle = COLORS[b.ci];
      pX.globalAlpha = a * 0.80;
      for (var k = 0; k < 9; k++) {
        var an = k / 9 * TAU + b.ph;
        pX.fillRect(x + Math.cos(an) * r * 0.94 - 1, y + Math.sin(an) * r * 0.88 - 1, 2, 2);
      }
      // 高光
      pX.fillStyle = "#fffdf4";
      pX.globalAlpha = a * 0.85;
      pX.fillRect(x - r * 0.40, y - r * 0.44, 2.1, 2.1);
    }
  }

  function drawStar(t) {
    var wob = Math.sin(t * 0.55) * 0.10;
    var cw = Math.cos(wob), sw = Math.sin(wob);
    var pulse = (0.82 + 0.18 * Math.sin(t * 1.7)) * starA;
    var lastCi = -1;

    // 星体辉光
    pX.globalCompositeOperation = "lighter";
    pX.globalAlpha = 0.10 * pulse;
    var haloR = starR * 4.4 * pulse;
    pX.drawImage(sprites[IDX_TREE + 1], cx - haloR, starY - haloR, haloR * 2, haloR * 2);
    pX.globalAlpha = 0.24 * pulse;
    var coreR = starR * 1.15;
    pX.drawImage(sprites[IDX_TREE + 3], cx - coreR, starY - coreR, coreR * 2, coreR * 2);

    // 旋转光芒
    pX.save();
    pX.translate(cx, starY);
    pX.rotate(t * 0.16);
    pX.globalAlpha = 0.20 * pulse;
    for (var r = 0; r < 4; r++) {
      var len = starR * (r % 2 === 0 ? 5.4 : 3.1);
      pX.save();
      pX.rotate(r * TAU / 4);
      var lg = pX.createLinearGradient(0, 0, len, 0);
      lg.addColorStop(0, "rgba(255,246,200,0.55)");
      lg.addColorStop(0.4, "rgba(255,228,150,0.13)");
      lg.addColorStop(1, "rgba(255,210,120,0)");
      pX.fillStyle = lg;
      pX.beginPath();
      pX.moveTo(0, -starR * 0.30);
      pX.lineTo(len, 0);
      pX.lineTo(0, starR * 0.30);
      pX.closePath();
      pX.fill();
      pX.restore();
    }
    pX.restore();

    // 粒子星体
    for (var i = 0; i < starP.length; i++) {
      var p = starP[i];
      var rx = p.rad * Math.cos(p.ang), ry = p.rad * Math.sin(p.ang);
      var x = cx + rx * cw - ry * sw;
      var y = starY + rx * sw + ry * cw;
      var tw = 0.65 + 0.35 * Math.sin(t * p.tw + p.ph);
      var a = p.a * tw * pulse;
      if (p.g) {
        pX.globalAlpha = Math.min(1, a * 1.3);
        pX.drawImage(sprites[p.ci], x - p.s * 2.4, y - p.s * 2.4, p.s * 4.8, p.s * 4.8);
      } else {
        if (p.ci !== lastCi) { pX.fillStyle = COLORS[p.ci]; lastCi = p.ci; }
        pX.globalAlpha = Math.min(1, a);
        pX.fillRect(x - p.s * 0.5, y - p.s * 0.5, p.s, p.s);
      }
    }
  }

  function drawCircle(t, dt) {
    cirRot -= dt * 0.045;                       // 结构反转（与树体相反）
    for (var q = 0; q < ringPh.length; q++) ringPh[q] += dt * ringSp[q];
    var sweep = t * 1.15;                       // 辐条雷达扫描角（约 5.5 秒一圈）
    var hxRot = t * 0.090;                      // 六芒星两三角反向转
    var runePos = t * 2.5;                      // 符文顺序点亮：0.4 秒一组
    var runeAct = (Math.floor(runePos) % 12 + 12) % 12;
    var runeFrac = runePos - Math.floor(runePos);
    var vg = [];
    for (var vk = 0; vk < 6; vk++) {
      var sv = Math.sin(t * 1.6 - vk * 1.0472);  // 六个角依次迸亮
      vg[vk] = sv > 0 ? sv * sv : 0;
    }
    var pulse = (0.75 + 0.25 * Math.sin(t * 0.9)) * cirA;
    var lastCi = -1;

    // 地面辉光
    pX.globalAlpha = 0.22 * pulse;
    pX.drawImage(sprites[IDX_TREE + 4], mcx - mrx * 1.35, mcy - mry * 2.4, mrx * 2.7, mry * 4.8);

    for (var i = 0; i < cirP.length; i++) {
      var p = cirP[i];
      var ca = p.hx ? (p.ang + cirRot + (p.tri ? -hxRot : hxRot))
                    : (p.ang + (p.rg >= 0 ? ringPh[p.rg] : cirRot));
      var mul = 1;
      if (p.sw) {                               // 辐条：扫过的扇区更亮
        var dd = ca - sweep;
        dd = dd - TAU * Math.round(dd / TAU);
        mul = 0.55 + 2.30 * Math.exp(-dd * dd / 0.34);
      } else if (p.hx) {                        // 六芒星：角点依次迸亮
        mul = 0.95 + 1.50 * (vg[p.v0] * (1 - p.e) + vg[p.v1] * p.e);
      } else if (p.rn !== undefined) {          // 符文：顺序点亮
        var dr = Math.abs(p.rn - runeAct);
        dr = Math.min(dr, 12 - dr);
        mul = dr === 0 ? (1.90 - 0.60 * runeFrac) : (dr === 1 ? 0.75 : 0.40);
      }
      var x = mcx + Math.cos(ca) * p.rad * mrx;
      var y = mcy + Math.sin(ca) * p.rad * mry;
      // 前后半圈明暗（近处更亮）
      var depth = 0.35 + 0.65 * ((Math.sin(ca) + 1) * 0.5);
      var tw = 0.6 + 0.4 * Math.sin(t * p.tw + p.ph);
      var a = p.a * tw * depth * pulse * mul * 0.90;
      if (a <= 0.012) continue;
      if (p.g) {
        pX.globalAlpha = Math.min(1, a * 1.4);
        var sz = p.s * 6;
        pX.drawImage(sprites[p.ci], x - sz * 0.5, y - sz * 0.5, sz, sz);
      } else {
        if (p.ci !== lastCi) { pX.fillStyle = COLORS[p.ci]; lastCi = p.ci; }
        pX.globalAlpha = Math.min(1, a);
        pX.fillRect(x - p.s * 0.5, y - p.s * 0.5, p.s, p.s);
      }
    }
  }

  /* 偶发流星 */
  function updateMeteors(dt) {
    meteorT -= dt;
    if (meteorT <= 0) {
      meteorT = rnd(3.2, 7.5);
      var dir = Math.random() < 0.5 ? -1 : 1;
      var sp = rnd(620, 1050);
      var ang = rnd(0.30, 0.58) * (Math.PI / 2);
      meteors.push({
        x: rnd(W * 0.10, W * 0.90), y: rnd(H * 0.03, H * 0.36),
        vx: Math.cos(ang) * sp * dir, vy: Math.sin(ang) * sp,
        life: rnd(0.55, 1.0), age: 0,
        ci: IDX_TREE + (Math.random() < 0.6 ? 0 : 3),
        s: rnd(1.4, 2.6)
      });
    }
    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.age += dt;
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      if (m.age > m.life) meteors.splice(i, 1);
    }
  }

  function drawMeteors() {
    for (var i = 0; i < meteors.length; i++) {
      var m = meteors[i];
      var env = Math.sin(Math.min(1, m.age / m.life) * Math.PI);
      pX.fillStyle = COLORS[m.ci];
      for (var k = 0; k < 16; k++) {
        var f = k / 15;
        var a = env * Math.pow(1 - f, 1.7) * 0.5;
        if (a <= 0.008) continue;
        var s = m.s * (1 - 0.55 * f);
        pX.globalAlpha = a;
        pX.fillRect(m.x - m.vx * 0.17 * f - s * 0.5,
          m.y - m.vy * 0.17 * f - s * 0.5, s, s);
      }
      pX.globalAlpha = env * 0.30;
      pX.drawImage(sprites[m.ci], m.x - m.s * 4, m.y - m.s * 4, m.s * 8, m.s * 8);
    }
  }

  function drawMotes(t, dt) {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      m.y += m.vy * dt;
      m.x += (m.vx + Math.sin(t * 0.8 + m.ph) * 6) * dt;
      if (m.y < apexY - treeH * 0.15) {
        m.y = groundY + rnd(0, 20);
        m.x = rnd(cx - R0 * 1.5, cx + R0 * 1.5);
      }
      var a = m.a * (0.5 + 0.5 * Math.sin(t * m.tw + m.ph)) * moteA;
      if (a <= 0.01) continue;
      pX.globalAlpha = Math.min(1, a);
      var s = m.s * 4.5;
      pX.drawImage(sprites[m.ci], m.x - s * 0.5, m.y - s * 0.5, s, s);
    }
  }

  function drawSparks(dt) {
    if (!sparks.length) return;
    for (var i = sparks.length - 1; i >= 0; i--) {
      var p = sparks[i];
      p.life -= dt;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      p.vy += 150 * dt;
      var damp = Math.pow(0.25, dt);
      p.vx *= damp; p.vy *= Math.pow(0.7, dt);
      p.x += p.vx * dt; p.y += p.vy * dt;
      var a = Math.min(1, p.life / 0.7);
      var s = p.s * (0.5 + 0.5 * a);
      pX.globalAlpha = 0.9 * a;
      pX.drawImage(sprites[p.ci], p.x - s * 0.5, p.y - s * 0.5, s, s);
    }
  }

  /* 沿树体表面向上流动的粒子 */
  function buildFlows(q) {
    flows = [];
    var n = Math.round(820 * q);
    for (var i = 0; i < n; i++) {
      var cool = Math.random() < 0.55;
      flows.push({
        h: rnd(0.015, 0.95),
        th: rnd(0, TAU),
        vh: rnd(0.015, 0.045),
        vt: rnd(0.30, 1.00) * (Math.random() < 0.72 ? 1 : -1),
        rMul: rnd(1.00, 1.05),
        s: rnd(1.3, 2.9),
        a: rnd(0.35, 0.88),
        ci: cool ? (IDX_COOL + ((Math.random() * COOL_N) | 0))
                 : (IDX_BAND + ((Math.random() * BAND_COLORS.length) | 0)),
        glow: Math.random() < 0.40,
        tw: rnd(0.7, 2.4), ph: rnd(0, TAU)
      });
    }
    flows.sort(function (a, b) { return a.ci - b.ci; });
  }
  function updateFlows(dt) {
    for (var i = 0; i < flows.length; i++) {
      var f = flows[i];
      f.h += f.vh * dt;
      f.th += f.vt * dt;
      if (f.h > 0.958) { f.h -= 0.905; f.th = rnd(0, TAU); }
    }
  }
  function drawFlows(cosR, sinR, t) {
    if (flowA < 0.02) return;
    var lastCi = -1;
    for (var i = 0; i < flows.length; i++) {
      var f = flows[i];
      var s0 = Math.sin(f.th), c0 = Math.cos(f.th);
      var sy = s0 * cosR + c0 * sinR;
      var sx = c0 * cosR - s0 * sinR;
      var depth = (sy + 1) * 0.5;
      var r = radiusAt(f.h) * f.rMul;
      var x = cx + sx * r;
      var y = groundY - treeH * f.h + sy * r * 0.16;
      var tw = 0.55 + 0.45 * Math.sin(t * f.tw + f.ph);
      var a = f.a * tw * (0.35 + 0.65 * depth) * flowA;
      if (a <= 0.02) continue;
      if (f.ci !== lastCi) { pX.fillStyle = COLORS[f.ci]; lastCi = f.ci; }
      if (f.glow) {
        pX.globalAlpha = Math.min(1, a * 0.55);
        pX.drawImage(sprites[f.ci], x - f.s * 2.2, y - f.s * 2.2, f.s * 4.4, f.s * 4.4);
      }
      pX.globalAlpha = Math.min(1, a);
      pX.fillRect(x - f.s * 0.5, y - f.s * 0.5, f.s, f.s);
      // 向上的拖尾
      pX.globalAlpha = Math.min(1, a * 0.42);
      pX.fillRect(x - f.s * 0.35, y + f.s * 0.95, f.s * 0.7, f.s * 0.7);
      pX.globalAlpha = Math.min(1, a * 0.16);
      pX.fillRect(x - f.s * 0.3, y + f.s * 1.9, f.s * 0.6, f.s * 0.6);
    }
  }

  /* ---------------- 开场浮动字幕 ---------------- */
  var TITLE_L1 = "Merry Christmas";
  var TITLE_L2 = "愿这束光 一直亮着";
  var titleChars = [], titleBox = null, titleDone = false;
  function buildTitle() {
    titleBox = document.getElementById("title");
    if (!titleBox || typeof titleBox.querySelector !== "function") { titleDone = true; return; }
    var l1 = titleBox.querySelector(".l1"), l2 = titleBox.querySelector(".l2");
    if (!l1 || !l2) return;
    l1.textContent = ""; l2.textContent = "";
    titleChars = [];
    var n = 0;
    function fill(el, str) {
      for (var i = 0; i < str.length; i++) {
        var ch = str.charAt(i);
        var sp = document.createElement("span");
        sp.textContent = (ch === " ") ? "\u00A0" : ch;
        el.appendChild(sp);
        var ang = rnd(0, TAU), d = rnd(55, 210);
        var up = -rnd(30, 150);
        titleChars.push({
          el: sp, i: n++,
          dx: Math.cos(ang) * d,
          dy: Math.sin(ang) * d * 0.55 + up,
          rot: rnd(-52, 52)
        });
      }
    }
    fill(l1, TITLE_L1);
    fill(l2, TITLE_L2);
  }
  function updateTitle(tt) {
    if (!titleBox || titleDone) return;
    var T_IN = 1.15, T_HOLD = 2.0, T_SC = 1.05;
    var tScatter = T_IN + T_HOLD;
    if (tt > tScatter + T_SC + 0.12) {
      titleBox.style.display = "none";
      titleDone = true;
      return;
    }
    titleBox.style.transform = "translateY(" + (Math.sin(tt * 1.5) * 5).toFixed(2) + "px)";
    for (var i = 0; i < titleChars.length; i++) {
      var c = titleChars[i];
      var d = c.i * 0.032;
      var op = 0, tx = 0, ty = 0, rot = 0, blur = 0;
      if (tt < tScatter) {
        var q = clamp01((tt - 0.30 - d) / 0.85);
        q = 1 - Math.pow(1 - q, 3);
        op = q;
        ty = 18 * (1 - q);
        rot = (1 - q) * 3.0;
      } else {
        var s2 = clamp01((tt - tScatter - d * 0.5) / T_SC);
        var e2 = s2 * s2;
        op = Math.max(0, 1 - s2 * 1.2);
        tx = c.dx * e2;
        ty = c.dy * e2;
        rot = c.rot * e2;
        blur = 7 * s2;
      }
      c.el.style.opacity = op.toFixed(3);
      c.el.style.transform = "translate(" + tx.toFixed(1) + "px," + ty.toFixed(1) + "px) rotate(" + rot.toFixed(1) + "deg)";
      c.el.style.filter = blur > 0.15 ? "blur(" + blur.toFixed(1) + "px)" : "none";
    }
  }

  /* ---------------- 许愿 ---------------- */
  var wishBox = document.getElementById("wish");
  var wishIn = document.getElementById("win");
  var wishGo = document.getElementById("wgo");
  var WISH_KEY = "xmas_wish_v1";
  var wishState = 0;        // 0 未出现 / 1 输入中 / 2 已许愿
  var wishReplay = false;   // 已许过愿的访客：进场后重放烟花
  var wishT = -99;          // 许愿完成的时刻
  var wishText = "";
  var fws = [], fwActive = false, fwElapsed = 0, fwNext = 0, fwRise = null;

  try {
    var savedWish = window.localStorage && window.localStorage.getItem(WISH_KEY);
    if (savedWish) { wishText = savedWish; wishState = 2; wishT = -99; wishReplay = true; }
  } catch (e0) { /* 隐私模式忽略 */ }

  function wishShow() {
    if (wishState !== 0 || !wishBox) return;
    wishState = 1;
    if (hint) hint.classList.add("gone");
    wishBox.style.display = "flex";
    void wishBox.offsetWidth;
    wishBox.classList.add("on");
  }

  function wishShake() {
    if (!wishBox) return;
    wishBox.classList.add("shake");
    setTimeout(function () { wishBox.classList.remove("shake"); }, 460);
  }

  function fwBurst(x, y, n, sp0, sp1, big) {
    var base = Math.random() < 0.55
      ? (IDX_BAND + ((Math.random() * 4) | 0))          // 香槟金系
      : (IDX_BAND + 4 + ((Math.random() * 4) | 0));     // 亚麻/胭脂系
    for (var i = 0; i < n; i++) {
      var a = rnd(0, TAU), sp = rnd(sp0, sp1) * (big ? 1.0 : 0.78);
      fws.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.92,
        life: rnd(1.0, 2.0) * (big ? 1.15 : 0.95), age: 0,
        s: rnd(1.3, 2.9),
        ci: (Math.random() < 0.72 ? base : (IDX_TREE + ((Math.random() * 4) | 0)))
      });
    }
  }

  function wishFire() {
    fwActive = true; fwElapsed = 0; fwNext = 0.02;
    fwRise = { x: cx, y: H * 0.52, y1: H * 0.26, t: 0, dur: 0.62 };
  }

  function wishSubmit() {
    if (wishState !== 1) return;
    var v = wishIn ? (wishIn.value || "").replace(/\s+/g, " ").trim() : "";
    if (!v) { wishShake(); return; }
    wishText = v.slice(0, 18);
    wishState = 2;
    wishT = introT;
    try { if (window.localStorage) window.localStorage.setItem(WISH_KEY, wishText); } catch (e1) {}
    if (wishIn) { try { wishIn.blur(); } catch (e2) {} }
    if (wishBox) {
      wishBox.classList.add("out");
      setTimeout(function () { wishBox.style.display = "none"; }, 740);
    }
    wishFire();
  }

  function updateFireworks(dt) {
    if (fwActive) {
      fwElapsed += dt;
      if (fwRise) {
        fwRise.t += dt;
        if (fwRise.t >= fwRise.dur) {
          fwBurst(cx, fwRise.y1, 132, 110, 340, 1);
          fwRise = null;
        }
      } else if (fwElapsed < 4.4) {
        fwNext -= dt;
        if (fwNext <= 0) {
          fwNext = rnd(0.20, 0.52);
          var r = Math.random();
          var n = r < 0.42 ? 44 : (r < 0.82 ? 88 : 150);
          fwBurst(rnd(W * 0.12, W * 0.88), rnd(H * 0.07, H * 0.40), n, 70, 240, r > 0.6);
        }
      } else if (fwElapsed > 5.1) { fwActive = false; }
    }
    for (var i = fws.length - 1; i >= 0; i--) {
      var q = fws[i];
      q.age += dt;
      if (q.age >= q.life) { fws.splice(i, 1); continue; }
      q.vy += 62 * dt;
      var dmp = Math.pow(0.22, dt);
      q.vx *= dmp; q.vy *= dmp;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
  }

  function drawFireworks() {
    if (fwRise) {
      var k = 1 - fwRise.t / fwRise.dur;
      var ry = fwRise.y + (fwRise.y1 - fwRise.y) * (1 - k * k);
      pX.globalAlpha = 0.55 + 0.35 * k;
      pX.drawImage(sprites[IDX_TREE + 1], fwRise.x - 15, ry - 15, 30, 30);
      if (pX.globalCompositeOperation === "lighter") {
        pX.globalAlpha = 0.42;
        pX.fillStyle = COLORS[IDX_TREE + 1];
        pX.fillRect(fwRise.x - 1, ry - 18, 2, 18);
      }
    }
    for (var i = 0; i < fws.length; i++) {
      var q = fws[i];
      var kk = 1 - q.age / q.life;
      var a = Math.pow(kk, 1.5) * 0.95;
      if (a <= 0.01) continue;
      var sz = q.s * (0.55 + 0.95 * kk) * 4.2;
      pX.globalAlpha = a;
      pX.drawImage(sprites[q.ci], q.x - sz * 0.5, q.y - sz * 0.5, sz, sz);
    }
  }

  /* ---------------- 主循环 ---------------- */
  function draw(t, dt) {
    rot += dt * 0.13;
    introT += dt;
    convK = smooth01((introT - INTRO_CONV0) / INTRO_CONV_DUR);
    snowA = clamp01((introT - 4.35) / 1.25);
    starA = clamp01((introT - 3.95) / 0.90);
    cirA = clamp01((introT - 6.10) / 1.50);
    moteA = clamp01((introT - 6.00) / 1.30);
    flowA = clamp01((convK - 0.55) / 0.45);
    updateTitle(introT);
    if (!hintShown && introT > 8.2) {
      hintShown = true;
      if (hint) hint.style.opacity = "";
    }
    if (!hintGone && introT > 14.5) {
      hintGone = true;
      if (hint) hint.classList.add("gone");
    }
    if (wishState === 0 && introT > 9.7) wishShow();
    if (wishReplay && introT > 9.7) { wishReplay = false; wishT = introT; wishFire(); }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(bgC, 0, 0, W, H);

    // "你会如愿的"：画在背景之上、粒子之下 → 从树后若隐若现
    if (wishState === 2) {
      var wBase = wishT > -50 ? (introT - wishT - 5.2) : (introT - 9.4);
      var wFade = clamp01(wBase / 2.8);
      if (wFade > 0.004) {
        var breath = 0.30 + 0.080 * Math.sin(t * 0.72);
        ctx.save();
        ctx.globalAlpha = wFade * breath;
        ctx.fillStyle = "#fff2e0";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        var wfs = Math.max(24, Math.min(W * 0.070, 70));
        ctx.font = wfs + 'px "STXingkai","华文行楷","STFangsong","FangSong","Songti SC","STSong",serif';
        ctx.shadowColor = "rgba(255,226,176,0.55)";
        ctx.shadowBlur = 20;
        var wLine = "你会如愿的", wStep = wfs * 1.60, wY = starY - treeH * 0.100;
        for (var wi = 0; wi < wLine.length; wi++) {
          ctx.fillText(wLine.charAt(wi), cx + (wi - (wLine.length - 1) / 2) * wStep, wY);
        }
        ctx.restore();
      }
    }

    pX.setTransform(DPR, 0, 0, DPR, 0, 0);
    pX.globalCompositeOperation = "source-over";
    pX.globalAlpha = 1;
    pX.clearRect(0, 0, W, H);
    pX.globalCompositeOperation = "lighter";

    var cosR = Math.cos(rot), sinR = Math.sin(rot);
    updateMeteors(dt);
    updateFlows(dt);
    updateBand(dt);
    updateFireworks(dt);
    drawSnow(t, dt, false);
    drawMeteors();
    drawCone(cosR, sinR, t);
    drawBand(cosR, sinR, t);
    drawFlows(cosR, sinR, t);
    drawBalls(cosR, sinR, t);
    drawMotes(t, dt);
    drawStar(t);
    drawCircle(t, dt);
    drawSnow(t, dt, true);
    drawSparks(dt);
    drawFireworks();

    // 合成 + 泛光
    ctx.drawImage(pC, 0, 0, W, H);
    bX.clearRect(0, 0, BW, BH);
    bX.globalCompositeOperation = "source-over";
    bX.drawImage(pC, 0, 0, BW, BH);
    ctx.globalCompositeOperation = "lighter";
    if (MOBILE) {
      ctx.globalAlpha = 0.24;
      ctx.drawImage(bC, -W * 0.04, -H * 0.04, W * 1.08, H * 1.08);
    } else {
      ctx.globalAlpha = 0.20;
      ctx.drawImage(bC, 0, 0, W, H);
      ctx.globalAlpha = 0.072;
      ctx.drawImage(bC, -W * 0.06, -H * 0.06, W * 1.12, H * 1.12);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  var last = performance.now();
  var fpsAcc = 0, fpsN = 0;
  function frame(now) {
    var dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    // 简易自适应：连续掉帧就抽稀体积雾，恢复后再补回来
    fpsAcc += dt;
    fpsN++;
    if (fpsN >= 45) {
      var avg = fpsAcc / fpsN;
      var hi = MOBILE ? 0.023 : 0.027, lo = MOBILE ? 0.017 : 0.019;
      if (avg > hi) thinMode = true;
      else if (avg < lo) thinMode = false;
      fpsAcc = 0;
      fpsN = 0;
    }
    draw(now / 1000, dt);
    requestAnimationFrame(frame);
  }

  /* ---------------- 构建 ---------------- */
  function rebuild() {
    DPR = Math.min(window.devicePixelRatio || 1, MOBILE ? 1.35 : 1.75);
    W = Math.max(320, window.innerWidth);
    H = Math.max(320, window.innerHeight);
    cvs.width = Math.round(W * DPR);
    cvs.height = Math.round(H * DPR);
    cvs.style.width = W + "px";
    cvs.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = true;

    layout();
    cyc = groundY - treeH * 0.5;

    if (!bgC) {
      bgC = document.createElement("canvas"); bgX = bgC.getContext("2d");
      pC = document.createElement("canvas"); pX = pC.getContext("2d");
      bC = document.createElement("canvas"); bX = bC.getContext("2d");
      buildSprites();
      buildSnowSprite();
    }
    BW = Math.max(1, Math.round(W * DPR / 4));
    BH = Math.max(1, Math.round(H * DPR / 4));
    bC.width = BW; bC.height = BH;
    pC.width = Math.round(W * DPR);
    pC.height = Math.round(H * DPR);

    var q = clamp(Math.sqrt((W * H) / (1280 * 800)), 0.55, 1.25) * (MOBILE ? 0.78 : 1);
    buildBackground();
    buildCone(q);
    buildBandLUT();
    buildBand(q);
    buildFlows(q);
    buildBalls(q);
      buildStar(q);
    buildCircle(q);
    buildMotes(q);
    buildSnow(q);
    sparks = [];
    meteors = [];
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(rebuild, 140);
  });
  buildTitle();
  var hint = document.getElementById("hint");
  if (hint) hint.style.opacity = "0";

  /* ---------------- 背景音乐 ---------------- */
  // 拿到歌之后：把音频放在本 HTML 同目录，把文件名填进 BGM_SRC（例如 "bgm.mp3"）即可
  var BGM_SRC = "bgm.mp3";
  var bgmEl = document.getElementById("bgm");
  var mbtn = document.getElementById("mbtn");
  var bgmOn = false;
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = null, acBuf = null, acSrc = null, acGain = null, decoding = false, triedAudioTag = false;
  var pendingPlay = false;   // 用户在解码完成前就点了：解码好之后自动接上

  function b64ToArrBuf(uri) {
    var b64 = uri.slice(uri.indexOf(",") + 1);
    var bin = atob(b64), n = bin.length, u8 = new Uint8Array(n);
    for (var i = 0; i < n; i++) u8[i] = bin.charCodeAt(i);
    return u8.buffer;
  }

  function decodeBgm() {
    if (acBuf || decoding || !AC) return;
    decoding = true;
    try {
      if (!ac) ac = new AC();
    } catch (e) { decoding = false; return; }
    var raw = null;
    if (BGM_SRC.slice(0, 5) !== "data:") {
      // 外链音频：先拿 ArrayBuffer，再解码
      fetch(BGM_SRC, { mode: "same-origin" }).then(function (r) { return r.arrayBuffer(); })
        .then(function (ab) { return decodeRaw(ab); })
        .catch(function () { decoding = false; });
      return;
    }
    try {
      raw = b64ToArrBuf(BGM_SRC);
      decodeRaw(raw);
    } catch (e) { decoding = false; }
  }

  function decodeRaw(raw) {
    var done = function (buf) {
      acBuf = buf; decoding = false;
      if (mbtn) mbtn.classList.add("ready");
      if (pendingPlay) { pendingPlay = false; bgmPlay(); }
    };
    var fail = function () { decoding = false; };
    try {
      var p = ac.decodeAudioData(raw, done, fail);
      if (p && typeof p.then === "function") p.then(done).catch(fail);
    } catch (e) { fail(); }
  }

  // 外链音频：<audio> 流式播放；被拦或出错时回落到 WebAudio
  function startTag() {
    if (!bgmEl) return;
    if (!triedAudioTag) { triedAudioTag = true; bgmEl.src = BGM_SRC; bgmEl.loop = true; }
    var pr = null;
    try { pr = bgmEl.play(); } catch (e) { pr = null; }
    var ok = function () {
      bgmOn = true;
      if (mbtn) { mbtn.classList.remove("off"); mbtn.textContent = "❚❚ 音乐"; }
    };
    var bad = function () {
      pendingPlay = true;
      decodeBgm();                     // 走 WebAudio 兜底
    };
    if (pr && typeof pr.then === "function") pr.then(ok).catch(bad);
    else if (pr === undefined) ok();
    else bad();
  }

  // 老浏览器 / 无 WebAudio：退回 <audio> 元素
  function playByTag() {
    if (!bgmEl || typeof bgmEl.play !== "function") return;
    if (!triedAudioTag) { triedAudioTag = true; bgmEl.src = BGM_SRC; bgmEl.loop = true; }
    try {
      var pr = bgmEl.play();
      if (pr && typeof pr.then === "function") {
        pr.then(function () { bgmOn = true; if (mbtn) { mbtn.classList.remove("off"); mbtn.textContent = "❚❚ 音乐"; } }).catch(function () {});
      } else { bgmOn = true; if (mbtn) { mbtn.classList.remove("off"); mbtn.textContent = "❚❚ 音乐"; } }
    } catch (e) { /* ignore */ }
  }

  function bgmPlay() {
    if (bgmOn) return;
    var isData = BGM_SRC.slice(0, 5) === "data:";
    if (!isData && bgmEl) { startTag(); return; }   // 外链音频：直接流式播放，不用等整首下载
    if (!AC) { playByTag(); return; }
    try { if (!ac) ac = new AC(); } catch (e) { playByTag(); return; }
    try { if (ac.state === "suspended" && ac.resume) ac.resume(); } catch (e) {}
    if (!acBuf) { pendingPlay = true; decodeBgm(); return; }   // 解码完成后自动接上
    try {
      if (acSrc) { try { acSrc.stop(); } catch (e) {} }
      if (!acGain) { acGain = ac.createGain(); acGain.gain.value = 0.55; acGain.connect(ac.destination); }
      acSrc = ac.createBufferSource();
      acSrc.buffer = acBuf;
      acSrc.loop = true;
      acSrc.connect(acGain);
      acSrc.start(0);
      bgmOn = true;
      if (mbtn) { mbtn.classList.remove("off"); mbtn.classList.add("ready"); mbtn.textContent = "❚❚ 音乐"; }
    } catch (e) { playByTag(); }
  }

  function bgmStop() {
    if (!bgmOn) return;
    try { if (acSrc) acSrc.stop(); } catch (e) {}
    acSrc = null;
    try { if (bgmEl) bgmEl.pause(); } catch (e) {}
    bgmOn = false;
    if (mbtn) { mbtn.classList.add("off"); mbtn.textContent = "♪ 音乐"; }
  }

  if (BGM_SRC) {
    decodeBgm();                 // 预解码，第一次点击就能立刻出声
    if (mbtn) {
      mbtn.style.display = "flex";
      mbtn.classList.add("off");
      mbtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        ev.preventDefault();
        if (bgmOn) bgmStop(); else bgmPlay();
      });
    }
    decodeBgm();                        // 预解码，点一下立刻出声
    setTimeout(function () { bgmPlay(); }, 60);   // 桌面浏览器允许时直接播
  }

  cvs.addEventListener("pointerdown", function (e) {
    burst(e.clientX, e.clientY);
    if (hint && !hint.classList.contains("gone")) hint.classList.add("gone");
    bgmPlay();               // 第一次交互时起播（浏览器允许）
  });
  if (wishGo) wishGo.addEventListener("click", function (ev) {
    ev.stopPropagation(); ev.preventDefault(); wishSubmit();
  });
  if (wishIn) wishIn.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" || ev.keyCode === 13) { ev.preventDefault(); wishSubmit(); }
  });
  if (wishBox) wishBox.addEventListener("pointerdown", function (ev) {
    ev.stopPropagation();
    bgmPlay();
  });

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) last = performance.now();
  });

  rebuild();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
